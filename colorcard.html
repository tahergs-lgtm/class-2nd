<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Color Card</title>

    <style>
        /* Universal selector - applies to eevrything on the page */

        * {

            font-size: 16px;

        }

        /* Elment selector - applies to a specific element

class selector - applies to elements with a specific class */

        .color-card {

            color: brown;

            font-family: Arial, sans-serif;

            background-color: lightblue;

        }
    </style>

</head>

<body>

    <div class="color-card">

        <h1>Color Card</h1>

        <p>Click the button below to change the background color of this card.</p>

    </div>

</body>

</html>
