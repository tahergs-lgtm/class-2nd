<!DOCTYPE html>
<html>
    <head>
          <title>ZOO</title>
    </head>
    <body>
           <h1>My Zoo</h1>
           <p>Use javascript and the DOM to add animals to each cage</p>
           <!-- DOM tree ;zoo is the parint element node.
           zone divs are child elements nodes. -->
           <div id="zoo">
              <div class="zone">zone 1 <span id="zone1"></span></div>
            <div class="zone">zone 2 <span id="zone2"></span></div>
            <div class="zone">zone 3 <span id="zone3"></span></div>
            <div class="zone">zone 4 <span id="zone4"></span></div>
 
           </div>
           <br>
           <button onclick="openzoo()">open the zoo</button>
           <p id="zoo-status"></p>
           <script>
             function openzoo(){
                document.getElementById("zone1").innerHTML="lionzone1";
                document.getElementById("zone2").innerHTML="reptileszone2";
                document.getElementById("zone3").innerHTML="birdszone3";
                document.getElementById("zone4").innerHTML="seaanimalszone4";
             }

           </script>
    </body>
</html>
