<!DOCTYPE html>
<html>
<head>
  <style> 
        body{
              font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
              margin: 20px;

        }
        h1{
           text-align: center;
        }
        .container{
            height: 1200px;
        }

        .box{
            width: 180px;
            height: 80px;
            text-align: center;
            color: red;
        }
        .relative{
          background: blue; 
          position: relative; 
          left:50px;
          top:20px;
        }
        

  </style>



</head>
<body>
    <h1>css positioning assignment</h1>
    <div class="container">  
     <div class="box sticky">sticky box</div>
<br>
<div class="box relative">relative box</div>

<div class="box absolute">absolute box</div>

<div class="box fixed">fixed box</div>
    </div>

</body>



</html>
