<!-- Multimedia means any content that is not just plain text.

It includes:

Images

Audio

Videos

Animations

HTML provides special tags to display multimedia on a webpage.

Real-Life Example

Think about YouTube.

It has:

Video

Audio

Images

All these are multimedia.

Why Do We Use Multimedia?

We use multimedia to

Make websites attractive

Explain information easily

Increase user engagement

Improve learning

Example:

Online classes

Music websites

Movie websites

Educational websites

HTML Multimedia Tags

Tag Purpose

<img> Display image

<audio> Play audio

<video> Play video

<source> Specify media files

<iframe> Embed another webpage -->
<!DOCTYPE html>
<html>

<title>multimedia</title>

</head>

</body>
