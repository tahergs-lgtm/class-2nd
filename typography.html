<!DOCTYPE html>
<html>
<head>
<title>my superhero card</title>
    <style>
            body{
                  background-color: rgb(80, 15, 221);
                  color: darkred;
                  font-family: Georgia, 'Times New Roman', Times, serif;


            }
            .hero-name{

                    font-size: 60px;
                    font-weight: bold;
                    color: maroon;
                     text-shadow: 3px 3px orange;

            }
            .tagline{
                     font-style: italic;
                     color: magenta;
                     text-transform:capitalize ;
                     text-shadow: 5px 5px black;
            }
            .labels{
                   text-transform: uppercase;
                   text-decoration: overline;
                    text-decoration: line-through;
                    transform: rotate(15deg);



            }




    </style>
</head>
<body>
    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in the school</p>
    
    <h2 class="labels">super power</h2>
    <p class="power">Can run faster than cheeth</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label"> weakness</h2>
    <p class="weakness">maths homework</p>
    <p class="made-by">created by</p>

</body>
</html>
