<!DOCTYPE html>
<html>
    <head>
          <title>ZOO ANIMALS</title>
          <style> 
            #zoo{
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                  color: white;
                  background-color: black;

            }
            .zone2{
              background-color: #ffffff;
                color: black;
            }
            .zone4{
              background-color: #ffffff;
                color: black;
            }
                
          </style>
    </head>
    <body>
           <h1>My Zoo</h1>
           <p>Use javascript and the DOM to add animals to each cage</p>
           <!-- DOM tree ;zoo is the parint element node.
           zone divs are child elements nodes. -->
           <div id="zoo">
              <div class="zone1">zone 1 <span id="zone1"></span></div>
            <div class="zone2">zone 2 <span id="zone2"></span></div>
            <div class="zone3">zone 3 <span id="zone3"></span></div>
            <div class="zone4">zone 4 <span id="zone4"></span></div>
 
           </div>
           <br>
           <button onclick="openzoo()">open the zoo</button>
           <p id="zoo-status"></p>
           <script>
             function openzoo(){
                document.getElementById("zone1").innerHTML="lion";
                document.getElementById("zone2").innerHTML="reptiles";
                document.getElementById("zone3").innerHTML="birds";
                document.getElementById("zone4").innerHTML="seaanimals";
             }

           </script>
    </body>
</html>
